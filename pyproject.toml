# ============================================================
# Python utilities — managed with `uv` (https://docs.astral.sh/uv/)
# ------------------------------------------------------------
# The Next.js app does NOT depend on Python. This manifest is provided
# so you can:
#   - run the original Colab notebook pipeline locally for parity
#   - run offline embeddings without hitting HuggingFace
#   - use any Python-only ML libraries you add later
#
# Quick start:
#   uv sync                                    # install deps
#   uv run python scripts/notebook_pipeline.py # run the notebook mirror
#   uv run python scripts/embed_offline.py     # generate embeddings
# ============================================================

[project]
name = "meaify-utils"
version = "0.1.0"
description = "Optional Python utilities for the Meaify grading system (mirrors the original Colab notebook)."
readme = "scripts/README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
    "google-generativeai>=0.8.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "nltk>=3.9.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "ipython>=8.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
